<!doctype html><meta charset="utf-8"><body style="margin:0;background:#fff">
<canvas id="c"></canvas>
<script type="module">
import * as pdfjs from '/node_modules/pdfjs-dist/build/pdf.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = '/node_modules/pdfjs-dist/build/pdf.worker.mjs';
const q = new URLSearchParams(location.search);
const doc = await pdfjs.getDocument({ url: q.get('f') }).promise;
const page = await doc.getPage(+(q.get('p') || 1));
const vp = page.getViewport({ scale: +(q.get('s') || 3) });
const c = document.getElementById('c');
c.width = Math.round(vp.width); c.height = Math.round(vp.height);
await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
window.__done = { w: c.width, h: c.height, pages: doc.numPages };
</script></body>
